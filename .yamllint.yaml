#
# yamllint configuration, used by `make lint-yaml` and CI.
# Rules: https://yamllint.readthedocs.io/en/stable/rules.html
extends: default

# Honour .gitignore, so build output and scratch files are not linted.
ignore-from-file: .gitignore

rules:
  # Configuration files read by GitHub and by tools (FUNDING.yml,
  # .golangci.yml) are conventionally written without a "---" document start.
  document-start: disable
  # GitHub workflows use the key `on`, which YAML 1.1 would read as a boolean;
  # values are still checked.
  truthy:
    check-keys: false
  # An action pinned to a commit SHA carries its version as a comment written
  # with one space, `uses: owner/action@<sha> # vX.Y.Z`, which is how
  # Dependabot and Renovate write and update it; such a line is also longer
  # than 80 columns.
  comments:
    min-spaces-from-content: 1
  line-length:
    max: 120
