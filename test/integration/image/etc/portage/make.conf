#
# The Portage settings of the integration image: those of the stage3,
# without the sandboxes that need privileges a container does not have.
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LC_MESSAGES=C.UTF-8
FEATURES="-ipc-sandbox -network-sandbox -pid-sandbox"
