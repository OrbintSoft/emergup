#
# The test repository syncs from its upstream in /srv/emergup-test, where a
# test publishes the changes it wants the next sync to bring.
[emergup-test]
location = /var/db/repos/emergup-test
sync-type = rsync
sync-uri = file:///srv/emergup-test
auto-sync = yes
