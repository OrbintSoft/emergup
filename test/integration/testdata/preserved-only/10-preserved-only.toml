#
# Every step but the preserved-library rebuild disabled, so that a run only
# rebuilds the packages that use preserved libraries.

[steps.sync]
enabled = false

[steps.update]
enabled = false

[steps.live-rebuild]
enabled = false

[steps.config-files]
enabled = false

[steps.depclean]
enabled = false
