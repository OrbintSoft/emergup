#
# Every step but the update disabled, so that a run only updates; the tests
# sync the repository with emerge before it.

[steps.sync]
enabled = false

[steps.live-rebuild]
enabled = false

[steps.preserved-rebuild]
enabled = false

[steps.config-files]
enabled = false

[steps.depclean]
enabled = false
