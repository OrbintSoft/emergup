#
# Every step but the depclean disabled, so that a run only removes the
# packages no longer needed.

[steps.sync]
enabled = false

[steps.news]
enabled = false

[steps.update]
enabled = false

[steps.live-rebuild]
enabled = false

[steps.preserved-rebuild]
enabled = false

[steps.config-files]
enabled = false
