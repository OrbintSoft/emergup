#
# Every step but the configuration-file update disabled, so that a run only
# updates the configuration files.

[steps.sync]
enabled = false

[steps.update]
enabled = false

[steps.live-rebuild]
enabled = false

[steps.preserved-rebuild]
enabled = false

[steps.depclean]
enabled = false
