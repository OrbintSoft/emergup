#
# Example /etc/emergup/config.toml.
#
# emergup works without any configuration file. This one shows every setting
# with its default value, commented out: uncomment and change only what you
# need. Changes can also go in drop-in files, /etc/emergup/config.d/*.toml,
# read after this file in lexical order; see the examples next to this file.
#
# A drop-in changes only the values it sets. The lists of entries (exclude,
# always-sync, keep-env) add up across files like USE in make.conf: a later
# file adds its entries, "-entry" removes one added earlier and "-*" clears
# the list.
# Every other value, a command line included, is replaced by the later file.
#
# `emergup config check` validates the files and reports each problem with
# its file and line; `emergup config show` prints the configuration in effect
# and where each value comes from.
#
# Commands are lists of arguments, never shell strings: write
# ["sh", "-c", "..."] when a shell is needed. Durations are written as Go
# writes them: "24h", "90m", "1h30m".

[elevation]
# How a command that needs root is run: "auto" uses the first of sudo, doas
# and run0 that is installed; "sudo", "doas" or "run0" forces one.
#method = "auto"
# The variables of your environment that the commands run as root keep,
# which the elevation would reset, such as EDITOR for dispatch-conf. sudo
# keeps them with --preserve-env, which its rule must allow: a rule for ALL
# does, a rule for some commands only needs SETENV. run0 keeps them with
# --setenv; doas keeps only what doas.conf keeps, as setenv { EDITOR }.
#keep-env = []

[steps.sync]
# Syncs the repositories; the names of the repositories due are appended to
# the command.
#enabled = true
#command = ["emerge", "--sync"]
# A repository synced more recently than this is skipped; "0s" syncs every
# repository on every run.
#min-interval = "24h"
# Repositories synced on every run, whatever min-interval says.
#always-sync = []

[steps.news]
# Lists the unread news items and asks whether to read them; the command
# shows them and marks them read. It runs as the user who started emergup
# when they can write /var/lib/gentoo/news, as the portage group can, and
# as root otherwise.
#enabled = true
#command = ["eselect", "news", "read", "new"]

[steps.update]
# Updates the target set. The command is followed by the options, an
# --exclude for each excluded package, and the target. emergup runs it with
# --pretend first and asks before the update: never put --ask in the options.
#enabled = true
#command = ["emerge"]
#options = ["--verbose", "--update", "--deep", "--newuse", "--verbose-conflicts"]
#target = "@world"
# Packages left out of the update, one package per entry.
#exclude = []

[steps.live-rebuild]
# Rebuilds the live packages. mode is "smart" (those whose upstream has
# changed, as smart-live-rebuild finds them), "interval" (each live package
# built longer ago than the interval), "always" (every live package), or
# "auto": smart when smart-live-rebuild is installed, interval otherwise.
# The step lists the packages it would rebuild, then asks; with none, it is
# skipped without a question.
#enabled = true
# Rebuilds the packages, in every mode, followed by them; emergup adds
# --usepkg-exclude-live=y, so that a live package is built from its
# sources and never installed from a binary package. emerge's own options
# go here.
#command = ["emerge", "--oneshot"]
#mode = "auto"
#interval = "24h"
# Lists, in the smart mode, the live packages whose upstream has changed:
# emergup adds --pretend after the program, which checks the upstreams as
# root and only lists the packages, and command rebuilds them.
#smart-command = ["smart-live-rebuild"]

[steps.preserved-rebuild]
# Rebuilds the packages that use preserved libraries, only when Portage
# reports some.
#enabled = true
#command = ["emerge", "@preserved-rebuild"]

[steps.config-files]
# Merges the pending configuration-file updates.
#enabled = true
#command = ["dispatch-conf"]

[steps.depclean]
# Removes the packages nothing needs any more; emergup runs it with
# --pretend first and asks before removing anything.
#enabled = true
#command = ["emerge", "--depclean"]

# Custom steps are commands that a run adds to its steps, each after a
# built-in step; there are none by default. Each custom step is a table of
# its own, [custom-steps.<name>], named with lowercase letters, digits and
# dashes, but not as a built-in step nor "run":
#
#   after       the built-in step it follows: sync, news, update,
#               live-rebuild, preserved-rebuild, config-files, depclean;
#               the custom steps after the same step run in the order of
#               their names;
#   command     the program and its arguments;
#   title       what it does, for its heading; by default the heading names
#               the program;
#   elevated    true runs the command as root, through the elevation method;
#               a custom step runs as the user who started emergup otherwise;
#   optional    true skips the step, with a notice, when its program is not
#               installed; the step fails then otherwise;
#   enabled     true by default; a drop-in turns off a custom step another
#               file adds with enabled = false.
#
# A custom step is announced, asked about and listed in the summary like a
# built-in step, and fails the run when its command fails; hooks run before
# and after it as they do around a built-in step. For example, haskell-updater
# rebuilds the Haskell packages that an update has broken. emergup asks before
# the step, so the options passed to emerge, after "--", have no --ask:
#
# [custom-steps.haskell]
# after = "preserved-rebuild"
# title = "rebuild the Haskell packages"
# command = ["haskell-updater", "--quiet", "--", "--verbose"]
# elevated = true
# optional = true

# Hooks are commands run before or after the whole run or a step, as the
# user who started emergup, without a question; there are none by default.
# Each hook is a table of its own, [hooks.<name>], named with lowercase
# letters, digits and dashes:
#
#   at          where it runs: "before-" or "after-" followed by run, for the
#               whole run, or by a step: sync, news, update, live-rebuild,
#               preserved-rebuild, config-files, depclean, or the name of a
#               custom step;
#   command     the program and its arguments;
#   elevated    true runs the command as root, through the elevation method;
#   interactive-only
#               true runs the hook only when someone answers the questions:
#               a run that answers them by itself, as under --yes, skips
#               it, with a notice, and goes on;
#   on-failure  "stop", the default, fails the run when the hook fails, as a
#               failed step does; "continue" only shows a notice; "ask" makes
#               the hook a check: its failure asks whether to run its remedy
#               and check again, to go on, or to abort the run;
#   remedy      the command a check offers to run, then checks again; Enter
#               and --yes run it, --yes only once; without one, Enter and
#               --yes abort the run;
#   remedy-elevated
#               true runs the remedy as root;
#   remedy-interactive-only
#               true offers the remedy only when someone answers the
#               questions: under --yes a failure aborts the run, as for a
#               check without a remedy;
#   remedy-status
#               the exit statuses of the check that its remedy fixes, from 1
#               to 255; any other failure offers no remedy, and Enter and
#               --yes abort the run. Empty, the default, any failure offers
#               it;
#   enabled     true by default; a drop-in turns off a hook another file adds
#               with enabled = false.
#
# A step's hooks run when the run reaches it, before its question, and once
# it has ended, however it ended; the hooks after the run run before the
# summary, even after a failure. Hooks at the same place run in the order of
# their names, and none starts once the run is stopped. A hook finds the run
# in its environment: EMERGUP_HOOK (its name), EMERGUP_STEP (the step, or
# run), EMERGUP_WHEN (before or after), EMERGUP_RUN_DIR and EMERGUP_LOG (the
# run's directory and log), and after a step EMERGUP_STEP_STATUS (succeeded,
# skipped or failed), after the run EMERGUP_RESULT (finished or failed); a
# hook or a remedy run as root gets them through the elevation as it gets
# the variables of keep-env. For example, a snapshot before the update:
#
# [hooks.snapshot]
# at = "before-update"
# command = ["/usr/local/sbin/snapshot", "before-update"]
#
# and a check before the run that the last backup is no older than 20 days,
# which exits with 1 when it is older and with 2 when the backup disk is not
# mounted: the backup, run as root, fixes the first, and would write onto
# the root filesystem in the second. A backup is long: a run under --yes
# aborts rather than start one.
#
# [hooks.backup]
# at = "before-run"
# command = ["/usr/local/bin/backup-check", "--max-age", "20d"]
# on-failure = "ask"
# remedy = ["/usr/local/sbin/backup"]
# remedy-elevated = true
# remedy-interactive-only = true
# remedy-status = [1]

[colors]
# How emergup's own lines look on a terminal; emerge keeps its own colours.
# A colour is written as words separated by spaces: attributes (bold, dim,
# italic, underline, reverse) and up to two colours, the text's and then the
# background's. A colour is a name (black, red, green, yellow, blue, magenta,
# cyan, white), the same name with "bright-" before it, "default" for the
# terminal's own, a number from 0 to 255 or "#rrggbb". "" leaves that kind of
# line plain. The defaults use only the sixteen colours the terminal's theme
# sets; NO_COLOR or TERM=dumb turns every colour off.
#heading = "bold blue"    # the heading of each step
#prompt = "bold cyan"     # a question, waiting for a key
#success = "green"        # a step that succeeded
#skip = "yellow"          # a step that was skipped, and why
#failure = "bold red"     # a step or command that failed
#notice = "magenta"       # a warning that is not a failure

[runs]
# Each run keeps its log, without colours, in a directory of its own under
# the state directory of the user who runs emergup: by default
# ~/.local/state/emergup/runs, or $XDG_STATE_HOME/emergup/runs when it is
# set. The oldest run directories are removed when a run starts; 0 keeps
# them all.
#keep = 10
