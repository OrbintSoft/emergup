#
# Dependabot opens a pull request when a Go module or a GitHub Action has an
# update. It runs on Monday mornings, a different day from Renovate
# (renovate.json5), which also covers the tool versions pinned in the Makefile
# and in the CI workflow.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    commit-message:
      prefix: ci
      include: scope
