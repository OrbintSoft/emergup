#
# Builds, tests and lints every push to master and every pull request, through
# the same Makefile targets used locally.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain named by the toolchain line of go.mod.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test with the race detector
        run: make race

  lint:
    name: make lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # markdownlint-cli2 runs through npx and needs a current Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # The Makefile takes yamllint from PATH; CI pins its version here.
      # --force replaces a yamllint the runner image may already carry, which
      # pipx would otherwise keep whatever its version.
      - name: Install yamllint
        run: pipx install --force yamllint==1.38.0

      - name: Lint
        run: make lint
