#
# Builds, tests and lints every push to master and every pull request, through
# the same Makefile targets used locally. The release workflow runs it too,
# before it publishes a release.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain named by the toolchain line of go.mod.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test with the race detector
        run: make race

  lint:
    name: make lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # markdownlint-cli2 runs through npx and needs a current Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # The Makefile takes yamllint from PATH; CI pins its version here. The
      # runner image carries its own yamllint in a pipx home the job cannot
      # modify, so the pinned one goes into a private pipx home that is put
      # first on PATH for the following steps.
      - name: Install yamllint
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx/bin
        run: |
          pipx install yamllint==1.38.0
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint
